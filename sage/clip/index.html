<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Sage…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 1rem;
    }
    .container { max-width: 480px; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p  { font-size: 1rem; opacity: 0.9; margin-bottom: 1.5rem; }
    a.btn {
      display: inline-block; padding: 0.75rem 1.5rem;
      background: #fff; color: #667eea; text-decoration: none;
      border-radius: 0.5rem; font-weight: 600; font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .debug { margin-top: 1.5rem; font-size: 0.75rem; opacity: 0.6; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Opening Sage…</h1>
    <p>If nothing happens, install Sage from Google Play.</p>
    <a id="cta" class="btn" href="https://play.google.com/store/apps/details?id=com.dmdbrands.sage">Get Sage on Google Play</a>
    <div id="debug" class="debug"></div>
  </div>

  <script>
    (function () {
      var PACKAGE = "com.dmdbrands.sage";

      // 1. Read the query string the NFC tag handed us, e.g.
      //    "?type=kettle&mac=C2:F5:36:B5:F5:2C"
      var raw = window.location.search || "";
      if (raw.charAt(0) === "?") raw = raw.substring(1);

      if (!raw) {
        // No tag payload — just send the user to the Play listing.
        window.location.replace("https://play.google.com/store/apps/details?id=" + PACKAGE);
        return;
      }

      // 2. Base64url-encode the payload (URL-safe alphabet, no "=" padding).
      //    Play Install Referrer accepts up to 200 chars in the referrer value.
      //    `type=kettle&mac=C2:F5:36:B5:F5:2C` lands at ~50 chars — comfortable.
      function base64url(str) {
        // btoa expects Latin-1; UTF-8 → percent-encode → unescape → btoa is
        // the canonical browser idiom for safely encoding arbitrary UTF-8.
        var b64 = btoa(unescape(encodeURIComponent(str)));
        return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      var encoded = base64url(raw);

      // 3. Redirect to the Play listing with the referrer attached.
      var dest = "https://play.google.com/store/apps/details"
               + "?id=" + encodeURIComponent(PACKAGE)
               + "&referrer=" + encoded;

      // Surface what we're sending so it's debuggable on first load.
      var debug = document.getElementById("debug");
      if (debug) debug.textContent = "referrer=" + encoded;

      // Keep the CTA in sync in case auto-redirect is blocked.
      document.getElementById("cta").href = dest;

      // `replace` (not `assign`) so the back button doesn't strand the
      // user on this redirect page.
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
